<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Random Repository</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-glow glow-1"></div>
    <div class="page-glow glow-2"></div>

    <div class="container">
        <div class="panel">
            <div class="eyebrow">Discover</div>
            <h1>GitHub Random Repository</h1>
            <p class="subtitle">Find a random GitHub repository by programming language.</p>

            <div class="controls">
                <select id="language" aria-label="Choose programming language">
                    <option value="">Select a language</option>
                    <option value="javascript">JavaScript</option>
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="cpp">C++</option>
                    <option value="php">PHP</option>
                    <option value="typescript">TypeScript</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                </select>

                <button id="find-btn">Find Repository</button>
            </div>

            <p id="message"></p>
            <div id="repository"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
